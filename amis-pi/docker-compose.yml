services:
  amis:
    build: .
    image: amis-pi:local
    restart: unless-stopped
    devices:
      - ${AMIS_UART_DEVICE:-/dev/ttyAMA0}:/dev/ttyAMA0
    ports:
      - "502:502"                      # Modbus/TCP für den Fronius
      - "8080:8080"                    # Web-UI
    volumes:
      - ./config:/config               # hier legt die Web-UI config.toml ab
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
