# Independent configuration: no GPIO device and no production configuration volume.
name: amis-pi-simulation
services:
  amis:
    build: .
    image: amis-pi:local
    command: ["-c", "/config/config.toml", "--simulate"]
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:1502:502"
    volumes:
      - ./config-simulation:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
